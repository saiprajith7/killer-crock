# BOSS Health — System Readiness configuration
# Installed to /etc/boss-health/boss-health.conf (override as needed).

[connectivity]
# ISOC endpoints for BOSS client sites (comma-separated).
isoc_hosts = isoc.nic.in,isoc.gov.in
isoc_port = 443
# Network reachability probes
network_hosts = 1.1.1.1,8.8.8.8,dns.google
network_port = 53
timeout_seconds = 3

[services]
# Critical OS services (checked if installed)
critical = dbus,NetworkManager,networking,systemd-logind,cron,rsyslog
# Security-related services (checked if installed)
security = ssh,sshd,apparmor,fail2ban,clamav-daemon,clamav-freshclam

[thresholds]
# Informational — CPU/RAM/Disk severity still comes from BOSS-Sentinel collectors
cpu_warn = 80
cpu_fail = 95
ram_warn = 85
ram_fail = 95
disk_warn = 85
disk_fail = 95
