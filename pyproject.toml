[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boss-sentinel"
version = "1.3.4"
description = "BOSS Health — System Readiness dashboard with integrated BOSS-Sentinel CPU/RAM monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "BOSS Health" }]
dependencies = []

[project.scripts]
boss-health = "boss_health.__main__:main"
boss-health-tray = "boss_health.__main__:tray_main"
boss-sentinel = "vitaheal.__main__:main"
boss-sentinel-daemon = "vitaheal.daemon.watcher:main"
vitaheal = "vitaheal.__main__:main"
vitaheal-daemon = "vitaheal.daemon.watcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vitaheal = ["ui/*.css", "ui/*.ui"]
boss_health = ["*.css"]
